name: Release npm Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to release (for example v1.0.2)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          tag="${tag#v}"
          test "$version" = "$tag" || {
            echo "package.json version ($version) does not match tag ($tag)"
            exit 1
          }

      - name: Check npm version is not already published
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "$(node -p "require('./package.json').name")@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "Version $version is already published"
            exit 1
          fi

      - name: Build plugin package
        run: pnpm build

      - name: Validate package contents
        run: npm pack --dry-run ./dist/atrium-pi-modelprovider-manager

      - name: Publish to npm with trusted publishing
        run: npm publish ./dist/atrium-pi-modelprovider-manager --access public --provenance
